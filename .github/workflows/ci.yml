# Integração contínua: instalar → verificar sintaxe → testes → build, falhando no primeiro erro.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        # ubuntu: testes de dados em PostgreSQL 16 real (Docker do runner); windows: compatibilidade Windows 64 bits.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências (lockfile)
        run: npm ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Testes automatizados
        run: npm test
      - name: Build da versão HTML pública
        run: npm run build
      - name: Auditoria de dependências
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high

  docker:
    name: imagem Docker do backend
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagem
        run: docker build -t barber-prime:ci .
      - name: Subir e conferir /api/health
        run: |
          docker run -d --name bp -p 3000:3000 barber-prime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs bp
          exit 1
